      Private Contribution Statistics
  </text>

  <text
      x="45"
      y="82"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      fill="#8b949e">
      GitHub contribution activity for FarisShikuku
  </text>


  <!-- Main contribution count -->

  <text
      x="45"
      y="145"
      font-family="Arial, Helvetica, sans-serif"
      font-size="48"
      font-weight="700"
      fill="#58a6ff">
      727
  </text>

  <text
      x="47"
      y="172"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      fill="#8b949e">
      Total contributions
  </text>


  <!-- Private contribution count -->

  <text
      x="300"
      y="145"
      font-family="Arial, Helvetica, sans-serif"
      font-size="48"
      font-weight="700"
