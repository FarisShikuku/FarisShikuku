name: Generate GitHub Metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate self-hosted metrics
        uses: lowlighter/metrics@latest
        with:
          user: FarisShikuku
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update GitHub metrics [Skip GitHub Action]"

          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories: 100
          repositories_affiliations: owner,collaborator,organization_member

          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes

          config_timezone: Africa/Nairobi
          config_display: regular
          optimize: css, xml

          retries: 3
          retries_delay: 60
          retries_output_action: 3
          retries_delay_output_action: 60
