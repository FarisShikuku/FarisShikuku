<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="360"
     viewBox="0 0 900 360">

  <defs>
    <linearGradient id="background"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect
      x="0"
      y="0"
      width="900"
      height="360"
      rx="18"
