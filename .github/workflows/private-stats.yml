name: Generate Private Contribution Stats

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: private-contribution-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate aggregate contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: FarisShikuku
        run: python scripts/generate_private_stats.py

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/private-stats.svg
          if git diff --cached --quiet; then
            echo "No private-stat changes."
            exit 0
          fi
          git commit -m "chore: update private contribution statistics [Skip GitHub Action]"
          git push
